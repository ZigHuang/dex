[package]
edition.workspace = true
license.workspace = true
name = "dex-core"
version.workspace = true

[lib]
name = "dex_core"
path = "src/lib.rs"

[[bin]]
name = "dex-write-config-schema"
path = "src/bin/config_schema.rs"

[lints]
workspace = true

[dependencies]
anyhow = { workspace = true }
arc-swap = { workspace = true }
async-channel = { workspace = true }
base64 = { workspace = true }
bm25 = { workspace = true }
chrono = { workspace = true, features = ["serde"] }
clap = { workspace = true, features = ["derive"] }
dex-analytics = { workspace = true }
dex-agent-graph-store = { workspace = true }
dex-api = { workspace = true }
dex-app-server-protocol = { workspace = true }
dex-apply-patch = { workspace = true }
dex-async-utils = { workspace = true }
dex-client = { workspace = true }
dex-code-mode = { workspace = true }
dex-connectors = { workspace = true }
dex-context-fragments = { workspace = true }
dex-config = { workspace = true }
dex-core-plugins = { workspace = true }
dex-diagnostics = { workspace = true }
dex-exec-server = { workspace = true }
dex-extension-api = { workspace = true }
dex-extension-items = { workspace = true }
dex-features = { workspace = true }
dex-feedback = { workspace = true }
dex-file-system = { workspace = true }
dex-login = { workspace = true }
dex-memories-read = { workspace = true }
dex-mcp = { workspace = true }
dex-model-provider-info = { workspace = true }
dex-models-manager = { workspace = true }
dex-shell-command = { workspace = true }
dex-execpolicy = { workspace = true }
dex-git-utils = { workspace = true }
dex-history = { workspace = true }
dex-hooks = { workspace = true }
dex-http-client = { workspace = true }
dex-install-context = { workspace = true }
dex-network-proxy = { workspace = true }
dex-otel = { workspace = true }
dex-plugin = { workspace = true }
dex-model-provider = { workspace = true }
dex-protocol = { workspace = true }
dex-response-debug-context = { workspace = true }
dex-prompts = { workspace = true }
dex-rollout = { workspace = true }
dex-rollout-trace = { workspace = true }
dex-rmcp-client = { workspace = true }
dex-sandboxing = { workspace = true }
dex-skills = { workspace = true }
dex-skills-extension = { workspace = true }
dex-state = { workspace = true }
dex-terminal-detection = { workspace = true }
dex-thread-store = { workspace = true }
dex-tools = { workspace = true }
dex-utils-absolute-path = { workspace = true }
dex-utils-audio = { workspace = true }
dex-utils-cache = { workspace = true }
dex-utils-image = { workspace = true }
dex-utils-home-dir = { workspace = true }
dex-utils-output-truncation = { workspace = true }
dex-utils-path = { workspace = true }
dex-utils-path-uri = { workspace = true }
dex-utils-plugins = { workspace = true }
dex-utils-pty = { workspace = true }
dex-utils-string = { workspace = true }
dex-utils-stream-parser = { workspace = true }
dex-windows-sandbox = { package = "dex-windows-sandbox", path = "../windows-sandbox-rs" }
dirs = { workspace = true }
dunce = { workspace = true }
eventsource-stream = { workspace = true }
futures = { workspace = true }
http = { workspace = true }
iana-time-zone = { workspace = true }
image = { workspace = true, features = ["jpeg", "png", "webp"] }
indexmap = { workspace = true }
libc = { workspace = true }
once_cell = { workspace = true }
rand = { workspace = true }
regex-lite = { workspace = true }
rmcp = { workspace = true, default-features = false, features = [
    "base64",
    "macros",
    "schemars",
    "server",
] }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
sha1 = { workspace = true }
shlex = { workspace = true }
similar = { workspace = true }
tempfile = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true, features = [
    "io-std",
    "macros",
    "process",
    "rt-multi-thread",
    "signal",
] }
tokio-util = { workspace = true, features = ["rt"] }
tokio-tungstenite = { workspace = true }
toml = { workspace = true }
toml_edit = { workspace = true }
tracing = { workspace = true, features = ["log"] }
url = { workspace = true }
uuid = { workspace = true, features = ["serde", "v4", "v5", "v7"] }
which = { workspace = true }
whoami = { workspace = true }

# Build OpenSSL from source for musl builds.
[target.x86_64-unknown-linux-musl.dependencies]
openssl-sys = { workspace = true, features = ["vendored"] }

# Build OpenSSL from source for musl builds.
[target.aarch64-unknown-linux-musl.dependencies]
openssl-sys = { workspace = true, features = ["vendored"] }

[target.'cfg(unix)'.dependencies]
dex-shell-escalation = { workspace = true }

[dev-dependencies]
assert_cmd = { workspace = true }
assert_matches = { workspace = true }
dex-exec-server-test-support = { workspace = true }
dex-image-generation-extension = { workspace = true }
dex-home = { workspace = true }
dex-otel = { workspace = true }
dex-test-binary-support = { workspace = true }
dex-utils-cargo-bin = { workspace = true }
dex-utils-redacted-string = { workspace = true }
dex-web-search-extension = { workspace = true }
core_test_support = { workspace = true }
ctor = { workspace = true }
insta = { workspace = true }
maplit = { workspace = true }
opentelemetry = { workspace = true }
predicates = { workspace = true }
pretty_assertions = { workspace = true }
test-case = "3.3.1"
opentelemetry_sdk = { workspace = true, features = [
    "experimental_metrics_custom_reader",
    "metrics",
] }
serial_test = { workspace = true }
tempfile = { workspace = true }
test-log = { workspace = true }
tracing-opentelemetry = { workspace = true }
tracing-subscriber = { workspace = true }
tracing-test = { workspace = true, features = ["no-env-filter"] }
walkdir = { workspace = true }
wiremock = { workspace = true }
zstd = { workspace = true }

[package.metadata.cargo-shear]
ignored = ["openssl-sys"]
ignored-paths = ["tests/remote_env_windows/*.rs"]
