[package]
edition.workspace = true
license.workspace = true
name = "dex-analytics"
version.workspace = true

[lib]
doctest = false
name = "dex_analytics"
path = "src/lib.rs"

[lints]
workspace = true

[dependencies]
dex-app-server-protocol = { workspace = true }
dex-git-utils = { workspace = true }
dex-login = { workspace = true }
dex-model-provider = { workspace = true }
dex-plugin = { workspace = true }
dex-protocol = { workspace = true }
dex-state = { workspace = true }
os_info = { workspace = true }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
sha1 = { workspace = true }
tokio = { workspace = true, features = [
    "macros",
    "rt-multi-thread",
] }
tracing = { workspace = true, features = ["log"] }

[dev-dependencies]
dex-utils-absolute-path = { workspace = true }
pretty_assertions = { workspace = true }
