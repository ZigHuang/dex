[package]
edition.workspace = true
license.workspace = true
name = "dex-model-provider"
version.workspace = true

[lib]
doctest = false
name = "dex_model_provider"
path = "src/lib.rs"

[lints]
workspace = true

[dependencies]
dex-api = { workspace = true }
dex-agent-identity = { workspace = true }
dex-aws-auth = { workspace = true }
dex-http-client = { workspace = true }
dex-feedback = { workspace = true }
dex-login = { workspace = true }
dex-model-provider-info = { workspace = true }
dex-models-manager = { workspace = true }
dex-otel = { workspace = true }
dex-protocol = { workspace = true }
dex-response-debug-context = { workspace = true }
http = { workspace = true }
tokio = { workspace = true, features = ["process", "sync", "time"] }
tracing = { workspace = true, features = ["log"] }

[dev-dependencies]
dex-utils-redacted-string = { workspace = true }
pretty_assertions = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true, features = ["macros", "rt"] }
wiremock = { workspace = true }
