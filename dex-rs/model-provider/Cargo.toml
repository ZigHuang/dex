dex-feedback = { workspace = true }
dex-features = { workspace = true }
dex-login = { workspace = true }
dex-runtime-agent-instance = { workspace = true }
dex-keyring-store = { workspace = true }
dex-model-provider-info = { workspace = true }
dex-models-manager = { workspace = true }
dex-otel = { workspace = true }
dex-protocol = { workspace = true }
dex-response-debug-context = { workspace = true }
dex-secrets = { workspace = true }
http = { workspace = true }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
sha2 = { workspace = true }
tokio = { workspace = true, features = ["io-util", "process", "sync", "time"] }
tracing = { workspace = true, features = ["log"] }
url = { workspace = true }

[dev-dependencies]
base64 = { workspace = true }
