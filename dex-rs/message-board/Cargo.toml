[package]
edition.workspace = true
license.workspace = true
name = "dex-message-board"
version.workspace = true

[lib]
name = "dex_message_board"
path = "src/lib.rs"
doctest = false

[lints]
workspace = true

[dependencies]
base64 = { workspace = true }
caseless = { workspace = true }
chrono = { workspace = true, features = ["serde"] }
dex-protocol = { workspace = true }
dex-state = { workspace = true }
dex-tools = { workspace = true }
futures = { workspace = true }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
sqlx = { workspace = true }
tokio = { workspace = true, features = ["fs", "rt", "sync"] }
tracing = { workspace = true }
uuid = { workspace = true, features = ["serde", "v7"] }

[dev-dependencies]
dex-attachment-store = { workspace = true }
dex-message-board-mcp = { workspace = true }
dex-utils-output-truncation = { workspace = true }
pretty_assertions = { workspace = true }
rmcp = { workspace = true, features = ["client", "server", "transport-async-rw"] }
tempfile = { workspace = true }
tokio = { workspace = true, features = ["io-util", "macros", "rt-multi-thread"] }
