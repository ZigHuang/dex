[package]
name = "dex-app-server"
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "dex-app-server"
path = "src/main.rs"

[[bin]]
name = "dex-app-server-test-notify-capture"
path = "src/bin/notify_capture.rs"

[[bin]]
name = "exec-server"
path = "src/bin/exec_server.rs"

[lib]
name = "dex_app_server"
path = "src/lib.rs"
doctest = false

[lints]
workspace = true

[dependencies]
anyhow = { workspace = true }
