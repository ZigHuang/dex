[package]
edition.workspace = true
license.workspace = true
name = "dex-memories-write"
version.workspace = true

[lib]
name = "dex_memories_write"
path = "src/lib.rs"
doctest = false

[lints]
workspace = true

[dependencies]
anyhow = { workspace = true }
chrono = { workspace = true }
dex-backend-client = { workspace = true }
dex-core = { workspace = true }
dex-config = { workspace = true }
dex-features = { workspace = true }
dex-git-utils = { workspace = true }
dex-login = { workspace = true }
dex-model-provider = { workspace = true }
dex-otel = { workspace = true }
dex-protocol = { workspace = true }
dex-rollout = { workspace = true }
dex-rollout-trace = { workspace = true }
dex-secrets = { workspace = true }
dex-state = { workspace = true }
dex-terminal-detection = { workspace = true }
dex-utils-absolute-path = { workspace = true }
dex-utils-output-truncation = { workspace = true }
dex-utils-template = { workspace = true }
futures = { workspace = true }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
tokio = { workspace = true, features = ["fs", "rt", "sync", "time"] }
tracing = { workspace = true, features = ["log"] }
uuid = { workspace = true, features = ["v4", "v5"] }

[dev-dependencies]
dex-model-provider-info = { workspace = true }
dex-models-manager = { workspace = true }
core_test_support = { workspace = true }
pretty_assertions = { workspace = true }
tempfile = { workspace = true }
tokio = { workspace = true, features = ["fs", "macros"] }
wiremock = { workspace = true }
