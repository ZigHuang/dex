[package]
edition.workspace = true
license.workspace = true
name = "dex-memories-extension"
version.workspace = true

[lib]
name = "dex_memories_extension"
path = "src/lib.rs"
doctest = false

[lints]
workspace = true

[dependencies]
dex-core = { workspace = true }
dex-extension-api = { workspace = true }
dex-features = { workspace = true }
dex-otel = { workspace = true }
dex-protocol = { workspace = true }
dex-tools = { workspace = true }
dex-utils-absolute-path = { workspace = true }
dex-utils-output-truncation = { workspace = true }
dex-utils-template = { workspace = true }
schemars = { workspace = true }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true, features = ["fs"] }

[dev-dependencies]
pretty_assertions = { workspace = true }
tempfile = { workspace = true }
tokio = { workspace = true, features = ["fs", "macros"] }
