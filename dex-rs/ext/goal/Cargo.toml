[package]
edition.workspace = true
license.workspace = true
name = "dex-goal-extension"
version.workspace = true

[lib]
name = "dex_goal_extension"
path = "src/lib.rs"
test = false
doctest = false

[lints]
workspace = true

[dependencies]
dex-analytics = { workspace = true }
dex-core = { workspace = true }
dex-extension-api = { workspace = true }
dex-otel = { workspace = true }
dex-protocol = { workspace = true }
dex-rollout = { workspace = true }
dex-state = { workspace = true }
dex-tools = { workspace = true }
dex-utils-template = { workspace = true }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
tokio = { workspace = true, features = ["sync"] }
tracing = { workspace = true }

[dev-dependencies]
anyhow = { workspace = true }
chrono = { workspace = true }
dex-utils-absolute-path = { workspace = true }
pretty_assertions = { workspace = true }
tempfile = { workspace = true }
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }
