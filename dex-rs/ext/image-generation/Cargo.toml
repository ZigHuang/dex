[package]
edition.workspace = true
license.workspace = true
name = "dex-image-generation-extension"
version.workspace = true

[lib]
name = "dex_image_generation_extension"
path = "src/lib.rs"
doctest = false

[lints]
workspace = true

[dependencies]
base64 = { workspace = true }
dex-api = { workspace = true }
dex-attachment-store = { workspace = true }
dex-core = { workspace = true }
dex-exec-server = { workspace = true }
dex-extension-api = { workspace = true }
dex-extension-items = { workspace = true }
dex-http-client = { workspace = true }
dex-login = { workspace = true }
dex-model-provider = { workspace = true }
dex-model-provider-info = { workspace = true }
dex-protocol = { workspace = true }
dex-tools = { workspace = true }
dex-utils-absolute-path = { workspace = true }
dex-utils-image = { workspace = true }
dex-utils-path-uri = { workspace = true }
http = { workspace = true }
schemars = { workspace = true }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
sha2 = { workspace = true }
tracing = { workspace = true }

[dev-dependencies]
image = { workspace = true, features = ["png"] }
pretty_assertions = { workspace = true }
tempfile = { workspace = true }
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }
