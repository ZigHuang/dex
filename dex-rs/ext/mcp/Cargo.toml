[package]
edition.workspace = true
license.workspace = true
name = "dex-mcp-extension"
version.workspace = true

[lib]
name = "dex_mcp_extension"
path = "src/lib.rs"
doctest = false

[lints]
workspace = true

[dependencies]
dex-core = { workspace = true }
dex-core-plugins = { workspace = true }
dex-config = { workspace = true }
dex-connectors = { workspace = true }
dex-connectors-extension = { workspace = true }
dex-exec-server = { workspace = true }
dex-extension-api = { workspace = true }
dex-features = { workspace = true }
dex-mcp = { workspace = true }
dex-plugin = { workspace = true }
dex-protocol = { workspace = true }
dex-utils-absolute-path = { workspace = true }
dex-utils-path-uri = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }
tokio = { workspace = true, features = ["sync"] }

[dev-dependencies]
dex-login = { workspace = true }
pretty_assertions = { workspace = true }
tempfile = { workspace = true }
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }
