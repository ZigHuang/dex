[package]
edition.workspace = true
license.workspace = true
name = "dex-extension-api"
version.workspace = true

[lib]
name = "dex_extension_api"
path = "src/lib.rs"
test = false
doctest = false

[lints]
workspace = true

[dependencies]
dex-core-plugin-common = { workspace = true }
dex-api = { workspace = true }
futures = { workspace = true }
dex-guardian-context = { workspace = true }
dex-history = { workspace = true }
dex-config = { workspace = true }
dex-context-fragments = { workspace = true }
dex-exec-server-protocol = { workspace = true }
dex-file-system = { workspace = true }
dex-mcp = { workspace = true }
dex-protocol = { workspace = true }
dex-tools = { workspace = true }
dex-utils-absolute-path = { workspace = true }
dex-utils-path-uri = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true, features = ["time"] }

[dev-dependencies]
pretty_assertions = { workspace = true }
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }
