[package]
edition.workspace = true
license.workspace = true
name = "dex-models-manager"
version.workspace = true

[lib]
doctest = false
name = "dex_models_manager"
path = "src/lib.rs"

[lints]
workspace = true

[dependencies]
chrono = { workspace = true, features = ["serde"] }
dex-http-client = { workspace = true }
dex-login = { workspace = true }
dex-otel = { workspace = true }
dex-protocol = { workspace = true }
dex-prompts = { workspace = true }
dex-utils-output-truncation = { workspace = true }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
tokio = { workspace = true, features = ["fs", "sync", "time"] }
tracing = { workspace = true, features = ["log"] }

[dev-dependencies]
pretty_assertions = { workspace = true }
serde_json = { workspace = true }
tempfile = { workspace = true }
