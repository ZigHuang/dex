name: Dex macOS release recovery

on:
  push:
    branches: [main]
    paths: [.github/workflows/dex-release-macos-recovery.yml]

permissions:
  contents: read

env:
  CARGO_NET_GIT_FETCH_WITH_CLI: 'true'
  CARGO_BUILD_JOBS: '2'
  CARGO_PROFILE_RELEASE_DEBUG: '0'
  CARGO_TERM_COLOR: never
  DEX_REPO_ROOT: ${{ github.workspace }}

jobs:
  metadata:
    if: github.repository == 'ZigHuang/dex'
    runs-on: ubuntu-slim
    permissions:
      contents: read
      actions: write
    steps:
      - name: Stop the obsolete queued macOS fallback
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          curl -fsSL -X POST \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            https://api.github.com/repos/ZigHuang/dex/actions/runs/41435873062/cancel || \
            python3 - <<'PY'
          import json
          import os
          import urllib.request

          request = urllib.request.Request(
              "https://api.github.com/repos/ZigHuang/dex/actions/runs/41435873062",
              headers={"Authorization": "Bearer " + os.environ["GH_TOKEN"], "Accept": "application/vnd.github+json"},
          )
          with urllib.request.urlopen(request, timeout=30) as response:
              run = json.load(response)
          if run["status"] != "completed":
              raise SystemExit("Could not stop the obsolete fallback")
          PY
  build:
    needs: metadata
    if: github.repository == 'ZigHuang/dex'
    name: Build ${{ matrix.target }}
    runs-on: macos-15
    timeout-minutes: 180
    strategy:
      fail-fast: false
      matrix:
        target: [aarch64-apple-darwin, x86_64-apple-darwin]
    env:
      TARGET: ${{ matrix.target }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          persist-credentials: false
          ref: rust-v0.166.0
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405
        with:
          python-version: '3.12'
          architecture: arm64
      - uses: dtolnay/rust-toolchain@e081816240890017053eacbb1bdf337761dc5582
        with:
          targets: ${{ matrix.target }}
      - name: Verify source and Rosetta
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$TARGET" == x86_64-apple-darwin ]]; then
            arch -x86_64 /usr/bin/true
          fi
          python3 - <<'PY'
          from pathlib import Path
          import subprocess
          import tomllib

          assert subprocess.check_output(["git", "rev-parse", "HEAD"], text=True).strip() == "bc4e4e319fb4c0523ee7f9231248f293b95c0c79"
          assert tomllib.loads(Path("dex-rs/Cargo.toml").read_text())["workspace"]["package"]["version"] == "0.166.0"
          PY
      - uses: ./.github/actions/setup-rusty-v8
        with:
          target: ${{ matrix.target }}
      - name: Build Dex and helpers until the primary release is published
        id: compile
        shell: bash
        run: |
          python3 - <<'PY'
          import os
          from pathlib import Path
          import signal
          import subprocess
          import time
          import urllib.error
          import urllib.request
          import json

          def published():
              request = urllib.request.Request(
                  "https://api.github.com/repos/ZigHuang/dex/releases/tags/rust-v0.166.0",
                  headers={"Accept": "application/vnd.github+json"},
              )
              try:
                  with urllib.request.urlopen(request, timeout=15) as response:
                      release = json.load(response)
                  return not release["draft"] and len(release["assets"]) == 9
              except (urllib.error.URLError, TimeoutError):
                  return False

          def finish(already_published):
              with open(os.environ["GITHUB_OUTPUT"], "a") as output:
                  output.write("already_published=" + str(already_published).lower() + "\n")

          if published():
              finish(True)
              raise SystemExit(0)
          environment = dict(os.environ)
          environment["STABLE_GIT_COMMIT"] = subprocess.check_output(["git", "rev-parse", "HEAD"], text=True).strip()
          command = ["cargo", "build", "--locked", "--release", "--target", os.environ["TARGET"], "--bin", "dex", "--bin", "dex-code-mode-host", "--bin", "dex-exec-server"]
          process = subprocess.Popen(command, cwd=Path("dex-rs"), env=environment, start_new_session=True)
          next_check = time.monotonic() + 120
          while process.poll() is None:
              if time.monotonic() >= next_check:
                  if published():
                      os.killpg(process.pid, signal.SIGTERM)
                      try:
                          process.wait(timeout=30)
                      except subprocess.TimeoutExpired:
                          os.killpg(process.pid, signal.SIGKILL)
                          process.wait()
                      print("Primary release already published; stopped the redundant build")
                      finish(True)
                      raise SystemExit(0)
                  next_check = time.monotonic() + 120
              time.sleep(5)
          if process.returncode:
              raise SystemExit(process.returncode)
          finish(False)
          PY
      - name: Assemble complete package and verify x64 execution
        if: steps.compile.outputs.already_published != 'true'
        shell: bash
        run: |
          set -euo pipefail
          release_dir="$GITHUB_WORKSPACE/dex-rs/target/$TARGET/release"
          python3 scripts/build_dex_package.py \
            --target "$TARGET" --variant dex --package-version 0.166.0 \
            --package-dir "$RUNNER_TEMP/dex-macos" \
            --archive-output "dist/dex-package-$TARGET.tar.gz" \
            --entrypoint-bin "$release_dir/dex" \
            --code-mode-host-bin "$release_dir/dex-code-mode-host" \
            --exec-server-bin "$release_dir/dex-exec-server" --strip all
          "$RUNNER_TEMP/dex-macos/bin/dex" --version
      - uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f
        if: steps.compile.outputs.already_published != 'true'
        with:
          name: dex-package-${{ matrix.target }}
          path: dist/dex-package-${{ matrix.target }}.tar.gz
          if-no-files-found: error
      - name: Preserve compiled binaries when packaging fails
        if: failure() && steps.compile.conclusion == 'success'
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f
        with:
          name: dex-binaries-${{ matrix.target }}
          path: dex-rs/target/${{ matrix.target }}/release/dex*
          if-no-files-found: error
