name: Complete Dex 0.166.0 with recovered macOS packages

on:
  push:
    branches: [main]
    paths: [.github/workflows/dex-release-publish-recovery.yml]

permissions:
  contents: read

jobs:
  wait:
    if: github.repository == 'ZigHuang/dex'
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    permissions:
      actions: read
      contents: read
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      RELEASE_TAG: rust-v0.166.0
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          persist-credentials: false
          ref: rust-v0.166.0
      - name: Wait for verified packages from the two original source builds
        shell: bash
        run: |
          python3 -u - <<'PY'
          import json
          import os
          from pathlib import Path
          import subprocess
          import time
          import tomllib
          import urllib.request

          source = subprocess.check_output(["git", "rev-parse", "HEAD"], text=True).strip()
          assert source == "bc4e4e319fb4c0523ee7f9231248f293b95c0c79", source
          assert tomllib.loads(Path("dex-rs/Cargo.toml").read_text())["workspace"]["package"]["version"] == "0.166.0"
          builds = {
              41424118118: ("d796a1c09ab318c726e2c7a932962b301789c6c2", [
                  "aarch64-unknown-linux-musl", "x86_64-unknown-linux-musl",
                  "aarch64-pc-windows-msvc", "x86_64-pc-windows-msvc",
              ]),
              41443625221: ("662a12546c10616c5f988665a694ff93e1a05a15", [
                  "aarch64-apple-darwin", "x86_64-apple-darwin",
              ]),
          }
          base = "https://api.github.com/repos/" + os.environ["GH_REPO"]
          headers = {"Authorization": "Bearer " + os.environ["GH_TOKEN"], "Accept": "application/vnd.github+json"}
          def get(path):
              request = urllib.request.Request(base + path, headers=headers)
              with urllib.request.urlopen(request, timeout=30) as response:
                  return json.load(response)

          for run_id, (head, _) in builds.items():
              run = get(f"/actions/runs/{run_id}")
              assert run["head_sha"] == head, run
              assert run["repository"]["full_name"] == os.environ["GH_REPO"]
          previous = None
          deadline = time.monotonic() + 150 * 60
          while True:
              missing = []
              for run_id, (_, targets) in builds.items():
                  jobs = {job["name"]: job for job in get(f"/actions/runs/{run_id}/jobs?per_page=100")["jobs"]}
                  artifacts = {item["name"]: item for item in get(f"/actions/runs/{run_id}/artifacts?per_page=100")["artifacts"]}
                  for target in targets:
                      job = jobs.get("Build " + target)
                      if job and job["status"] == "completed" and job["conclusion"] != "success":
                          raise SystemExit(f"Required build failed: {target}: {job['conclusion']}")
                      artifact = artifacts.get("dex-package-" + target)
                      if artifact is None or not job or job["conclusion"] != "success":
                          missing.append(target)
                          continue
                      assert not artifact["expired"] and artifact["size_in_bytes"] > 0, artifact
              if missing != previous:
                  print("Waiting for:", ", ".join(missing) or "none", flush=True)
                  previous = missing
              if not missing:
                  break
              if time.monotonic() >= deadline:
                  raise SystemExit("Timed out waiting for complete release packages")
              time.sleep(120)
          PY
  publish:
    needs: wait
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      actions: read
      contents: write
    concurrency:
      group: dex-release-publication
      cancel-in-progress: false
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      RELEASE_TAG: rust-v0.166.0
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          persist-credentials: false
          ref: rust-v0.166.0
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          github-token: ${{ github.token }}
          run-id: 41424118118
          pattern: dex-package-*-unknown-linux-musl
          path: dist
          merge-multiple: true
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          github-token: ${{ github.token }}
          run-id: 41424118118
          pattern: dex-package-*-pc-windows-msvc
          path: dist
          merge-multiple: true
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          github-token: ${{ github.token }}
          run-id: 41443625221
          pattern: dex-package-*-apple-darwin
          path: dist
          merge-multiple: true
      - name: Verify all complete packages and prepare checksums and installers
        shell: bash
        run: |
          python3 - <<'PY'
          import hashlib
          import json
          from pathlib import Path, PurePosixPath
          import shutil
          import tarfile

          targets = {
              "aarch64-unknown-linux-musl", "x86_64-unknown-linux-musl",
              "aarch64-pc-windows-msvc", "x86_64-pc-windows-msvc",
              "aarch64-apple-darwin", "x86_64-apple-darwin",
          }
          expected = {f"dex-package-{target}.tar.gz" for target in targets}
          assert {path.name for path in Path("dist").iterdir()} == expected
          checksums = []
          for target in sorted(targets):
              archive = Path("dist") / f"dex-package-{target}.tar.gz"
              suffix = ".exe" if "windows" in target else ""
              required = {
                  f"bin/dex{suffix}", f"bin/dex-code-mode-host{suffix}",
                  f"bin/dex-exec-server{suffix}", f"dex-path/rg{suffix}",
              }
              if "linux" in target:
                  required.add("dex-resources/bwrap")
              if "windows" in target:
                  required.update({"dex-resources/dex-command-runner.exe", "dex-resources/dex-windows-sandbox-setup.exe"})
              members = {}
              metadata = None
              with tarfile.open(archive, mode="r|gz") as package:
                  for member in package:
                      name = str(PurePosixPath(member.name))
                      assert name not in members, name
                      members[name] = member
                      if name == "dex-package.json":
                          metadata = json.load(package.extractfile(member))
              assert metadata == {
                  "layoutVersion": 1, "version": "0.166.0", "target": target, "variant": "dex",
                  "entrypoint": f"bin/dex{suffix}", "execServer": f"bin/dex-exec-server{suffix}",
                  "resourcesDir": "dex-resources", "pathDir": "dex-path",
              }, metadata
              for name in required:
                  member = members[name]
                  assert member.isfile() and member.size > 0, name
                  if "windows" not in target:
                      assert member.mode & 0o100, name
              with archive.open("rb") as package:
                  digest = hashlib.file_digest(package, "sha256").hexdigest()
              checksums.append(f"{digest}  {archive.name}\n")
              print("Verified complete package:", target)
          Path("dist/dex-package_SHA256SUMS").write_text("".join(sorted(checksums, key=lambda line: line.split()[1])))
          for installer in ("install.sh", "install.ps1"):
              shutil.copyfile(Path("scripts/install") / installer, Path("dist") / installer)
          PY
      - name: Publish the complete stable GitHub Release
        shell: bash
        run: |
          python3 - <<'PY'
          import hashlib
          import json
          import os
          from pathlib import Path
          import subprocess

          tag = os.environ["RELEASE_TAG"]
          endpoint = "repos/" + os.environ["GH_REPO"] + "/releases/tags/" + tag
          def release():
              result = subprocess.run(["gh", "api", endpoint], capture_output=True, text=True)
              if result.returncode:
                  if "HTTP 404" in result.stderr:
                      return None
                  raise SystemExit(result.stderr)
              return json.loads(result.stdout)

          expected = {}
          for path in Path("dist").iterdir():
              with path.open("rb") as contents:
                  expected[path.name] = (path.stat().st_size, "sha256:" + hashlib.file_digest(contents, "sha256").hexdigest())
          existing = release()
          if existing is None:
              subprocess.run(["gh", "release", "create", tag, *[str(path) for path in sorted(Path("dist").iterdir())],
                              "--verify-tag", "--draft", "--generate-notes", "--title", "Dex v0.166.0"], check=True)
          elif existing["draft"]:
              subprocess.run(["gh", "release", "upload", tag, *[str(path) for path in sorted(Path("dist").iterdir())], "--clobber"], check=True)
          else:
              assets = {asset["name"]: (asset["size"], asset["digest"]) for asset in existing["assets"]}
              assert set(assets) <= set(expected), assets
              for name, digest in assets.items():
                  if name != "dex-package_SHA256SUMS":
                      assert digest == expected[name], name
              missing = sorted(set(expected) - set(assets))
              if missing or assets.get("dex-package_SHA256SUMS") != expected["dex-package_SHA256SUMS"]:
                  assert not existing.get("immutable", False), "This release does not allow adding assets"
                  if missing:
                      subprocess.run(["gh", "release", "upload", tag, *[str(Path("dist") / name) for name in missing]], check=True)
                  subprocess.run(["gh", "release", "upload", tag, "dist/dex-package_SHA256SUMS", "--clobber"], check=True)
          uploaded = release()
          assert uploaded["tag_name"] == tag and not uploaded["prerelease"]
          assets = {asset["name"]: (asset["size"], asset["digest"]) for asset in uploaded["assets"]}
          assert len(expected) == 9 and assets == expected, assets
          if uploaded["draft"]:
              subprocess.run(["gh", "release", "edit", tag, "--draft=false", "--prerelease=false", "--latest"], check=True)
          published = release()
          assert not published["draft"] and not published["prerelease"]
          print("Published and verified:", published["html_url"])
          PY
