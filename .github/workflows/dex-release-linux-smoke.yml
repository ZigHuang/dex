name: Verify Dex 0.166.0 Linux release package

on:
  push:
    branches: [main]
    paths: [.github/workflows/dex-release-linux-smoke.yml]

permissions:
  contents: read
  actions: read

jobs:
  smoke:
    if: github.repository == 'ZigHuang/dex'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          persist-credentials: false
          ref: rust-v0.166.0
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405
        with:
          python-version: '3.12'
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          github-token: ${{ github.token }}
          run-id: 41424118118
          name: dex-package-x86_64-unknown-linux-musl
          path: verified
      - name: Enable the sandbox's user namespaces on this test runner
        shell: bash
        run: |
          if [[ -f /proc/sys/kernel/apparmor_restrict_unprivileged_userns ]]; then
            sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          fi
      - name: Test the packaged CLI, executor sandbox, V8 host, and bundled ripgrep
        shell: bash
        run: |
          set -euo pipefail
          export PYTHONPATH="$GITHUB_WORKSPACE/sdk/python/src:$GITHUB_WORKSPACE/sdk/python/tests"
          archive="$GITHUB_WORKSPACE/verified/dex-package-x86_64-unknown-linux-musl.tar.gz"
          uv run --frozen --project scripts/dex_package/smoke_tests pytest -q \
            scripts/dex_package/smoke_tests/test_dex_package.py::test_cli_public_commands \
            scripts/dex_package/smoke_tests/test_dex_package.py::test_cli_version_matches_release_sources \
            'scripts/dex_package/smoke_tests/test_dex_package.py::test_packaged_executor_initializes_and_enforces_sandbox[cli_root]' \
            'scripts/dex_package/smoke_tests/test_dex_package.py::test_app_server_runs_code_mode_through_python_sdk[dex]' \
            --compression gzip --package-target x86_64-unknown-linux-musl \
            --cli-archive "$archive" --app-server-archive "$archive" --symbols-archive "$archive"
