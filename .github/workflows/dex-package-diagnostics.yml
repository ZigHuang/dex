name: Dex package diagnostics

on:
  push:
    branches: [main]
    paths: [.github/workflows/dex-package-diagnostics.yml]

permissions:
  actions: read
  checks: write
  contents: read

jobs:
  diagnose:
    if: github.repository == 'ZigHuang/dex'
    runs-on: ubuntu-slim
    steps:
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405
        with:
          python-version: '3.12'
      - name: Collect macOS ARM package failure
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY'
          import gzip
          import io
          import json
          import os
          import re
          import subprocess
          import urllib.request
          import zipfile

          base = "https://api.github.com/repos/ZigHuang/dex"
          token = os.environ["GH_TOKEN"]
          result = subprocess.run(
              ["curl", "-fsSL", "--connect-timeout", "10", "--max-time", "60", "-H", "Authorization: Bearer " + token,
               base + "/actions/jobs/125211929859/logs"],
              check=True, capture_output=True,
          )
          data = result.stdout
          if data.startswith(b"\x1f\x8b"):
              data = gzip.decompress(data)
          elif data.startswith(b"PK\x03\x04"):
              with zipfile.ZipFile(io.BytesIO(data)) as archive:
                  data = b"\n".join(archive.read(name) for name in archive.namelist() if not name.endswith("/"))
          encoding = "utf-16" if data.startswith((b"\xff\xfe", b"\xfe\xff")) else "utf-8-sig"
          log = re.sub(r"\x1b\[[0-?]*[ -/]*[@-~]", "", data.decode(encoding, errors="replace"))
          excerpt = "\n".join(log.splitlines()[-200:])[-30000:].replace(token, "***")
          payload = {
              "name": "Dex macOS ARM package diagnostics",
              "head_sha": "bc4e4e319fb4c0523ee7f9231248f293b95c0c79",
              "status": "completed",
              "conclusion": "neutral",
              "output": {"title": "macOS ARM package failure", "summary": "```text\n" + excerpt + "\n```"},
          }
          request = urllib.request.Request(
              base + "/check-runs", data=json.dumps(payload).encode(),
              headers={"Authorization": "Bearer " + token, "Accept": "application/vnd.github+json", "Content-Type": "application/json"},
              method="POST",
          )
          with urllib.request.urlopen(request, timeout=30) as response:
              check = json.load(response)
          print("Package diagnostics check:", check["id"])
          PY
